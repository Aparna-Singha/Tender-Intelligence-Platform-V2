name: Encrypted API image transfer 07448b4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-transfer-07448b4
  cancel-in-progress: false

jobs:
  build-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: 07448b438e49b1c5d775e6a4a8b1608f7aee84e2
      IMAGE_NAME: tender-api
      # Reuse the previously verified public age recipient and private identity.
      AGE_RECIPIENT: ${{ vars.BIDVEDA_WORKER_IMAGE_AGE_RECIPIENT }}
    steps:
      - name: Require an encryption recipient
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AGE_RECIPIENT" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]] || {
            echo 'An age recipient repository variable is required.' >&2
            exit 1
          }

      - name: Check out exact approved API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 07448b438e49b1c5d775e6a4a8b1608f7aee84e2
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and deployment scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only e71616555ad0ec47be4cfc98f193bcd69660048c "$SOURCE_SHA" -- packages/database/prisma/migrations)"
          test -f apps/api/src/common/maintenance-admission.ts
          test -f apps/api/src/common/request-lifecycle-hooks.ts
          test ! -e .env.staging
          test ! -e .env.production

      - name: Check runner build capacity
        shell: bash
        run: |
          set -euo pipefail
          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          disk_bytes=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          if (( available_kib < 5 * 1024 * 1024 || disk_bytes < 8 * 1000 * 1000 * 1000 )); then
            echo 'Runner memory or disk capacity is below the reviewed build gate.' >&2
            exit 1
          fi

      - name: Build only the Linux AMD64 API image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$IMAGE_NAME:$SOURCE_SHA"
          docker build --platform linux/amd64 \
            --file infrastructure/docker/api.Dockerfile \
            --tag "$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            .

      - name: Verify image identity and runtime files
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$IMAGE_NAME:$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE_TAG" -ec \
            'test -f /app/dist/main.js && test -d /app/node_modules/@tender/database && test -d /app/node_modules/fastify'
          if docker image inspect "$IMAGE_TAG" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Eq '^(DATABASE_URL|REDIS_URL|GEMINI_API_KEY|COOKIE_SECRET|S3_SECRET_ACCESS_KEY)='; then
            echo 'Runtime image contains a prohibited secret variable.' >&2
            exit 1
          fi

      - name: Encrypt compressed Docker archive
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$IMAGE_NAME:$SOURCE_SHA"
          umask 077
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          mkdir -p transfer
          trap 'rm -f transfer/api-image.tar.gz' EXIT
          docker save "$IMAGE_TAG" | gzip -n -1 > transfer/api-image.tar.gz
          sha256sum transfer/api-image.tar.gz | sed 's#transfer/##' > transfer/archive.sha256
          age -r "$AGE_RECIPIENT" -o transfer/api-image.tar.gz.age transfer/api-image.tar.gz
          sha256sum transfer/api-image.tar.gz.age | sed 's#transfer/##' > transfer/ciphertext.sha256
          (cd transfer && sha256sum --check archive.sha256 && sha256sum --check ciphertext.sha256) >/dev/null
          jq -n --arg source "$SOURCE_SHA" --arg tag "$IMAGE_TAG" \
            --arg imageId "$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')" \
            --argjson diffIds "$(docker image inspect "$IMAGE_TAG" --format '{{json .RootFS.Layers}}')" \
            --arg architecture amd64 \
            '{source:$source,tag:$tag,imageId:$imageId,diffIds:$diffIds,architecture:$architecture}' > transfer/manifest.json
          rm -f transfer/api-image.tar.gz
          bytes=$(stat -c '%s' transfer/api-image.tar.gz.age)
          if (( bytes > 400000000 )); then
            echo 'Encrypted image exceeds the 400 MB transfer cap.' >&2
            exit 1
          fi
          echo "Encrypted image bytes: $bytes"

      - name: Upload encrypted transfer artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tender-api-07448b4-encrypted
          path: |
            transfer/api-image.tar.gz.age
            transfer/archive.sha256
            transfer/ciphertext.sha256
            transfer/manifest.json
          if-no-files-found: error
          retention-days: 3
